name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: gibiverse
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gibiverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/gibiverse
      BETTER_AUTH_SECRET: ci-test-secret-32-bytes-long-pad
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:8787
      GOOGLE_CLIENT_ID: ci-test-google-client-id
      GOOGLE_CLIENT_SECRET: ci-test-google-client-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply DB migrations
        working-directory: apps/api
        run: pnpm exec drizzle-kit migrate

      - run: pnpm turbo lint typecheck format:check

      - run: pnpm check-glossary

      - run: pnpm turbo test
